[project]
name = "dl-framework-comparison"
version = "0.1.0"
description = "DL Framework comparison (TensorFlow vs. PyTorch) using the Intel Image Classification Dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "scikit-learn>=1.8.0",
    "tensorflow>=2.20.0",
    "torch>=2.10.0",
    "torchvision>=0.25.0",
]
